<!doctype html>
<html lang="en">
    <head>
        <!-- Required meta tags always come first -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>JQuery Practice</title>

        <!-- CSS -->
        <link rel="stylesheet" type="text/css" href="css/main.css" />
        <!-- JQuery -->
        <script src="js/jquery.js" type="text/javascript"></script>
        <script src="js/main.js" type="text/javascript"></script>
    </head>
    <body>
        <h1>Jacqui's Flower Shop</h1>
        <form method="post">
            <div id="oblock">
                <div class="dtable">
                    <div id="row1" class="drow">
                        <div class="dcell">
                            <img src="img/aster.png" /><label for="aster"
                                >Aster:</label
                            >
                            <input name="aster" value="0" required />
                        </div>
                        <div class="dcell">
                            <img src="img/daffodil.png" /><label for="daffodil"
                                >Daffodil:</label
                            >
                            <input name="daffodil" value="0" required />
                        </div>
                        <div class="dcell">
                            <img src="img/rose.png" /><label for="rose"
                                >Rose:</label
                            >
                            <input name="rose" value="0" required />
                        </div>
                    </div>
                    <div id="row2" class="drow">
                        <div class="dcell">
                            <img src="img/peony.png" /><label for="peony"
                                >Peony:</label
                            >
                            <input name="peony" value="0" required />
                        </div>
                        <div class="dcell">
                            <img src="img/primula.png" /><label for="primula"
                                >Primula:</label
                            >
                            <input name="primula" value="0" required />
                        </div>
                        <div class="dcell">
                            <img src="img/snowdrop.png" /><label for="snowdrop"
                                >Snowdrop:</label
                            >
                            <input name="snowdrop" value="0" required />
                        </div>
                    </div>
                </div>
            </div>
            <div id="buttonDiv"><button type="submit">Place Order</button></div>
        </form>

        <!-- JS. -->
        <script src="" type="text/javascript"></script>
    </body>
</html>
