<!doctype html>
<html lang="en">
    <head>
        <!-- Required meta tags always come first -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Jump for Joy</title>

        <!-- CSS -->
        <link rel="stylesheet" type="text/css" href="jumps.css" />
        <!-- JQuery -->
        <script src="jquery.js" type="text/javascript"></script>
        <script type="text/javascript">
            $(() => {
                $(".main > div").addClass("jumps");
                $(".jumps").click(() => {
                    let discount = Math.floor(Math.random() * 10);
                    let discount_msg = `<p>You clicked on a jump! Discount: ${discount}%</p>`;
                    $("header").append(discount_msg);
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h2>Jump for Joy</h2>
        </div>
        <div class="main">
            <div><img src="images/jump1.png" alt="" /></div>
            <div><img src="images/jump2.png" alt="" /></div>
            <div><img src="images/jump3.png" alt="" /></div>
            <div><img src="images/jump4.png" alt="" /></div>
        </div>

        <!-- JS. -->
        <script src="" type="text/javascript"></script>
    </body>
</html>
